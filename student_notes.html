<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="milex-perm" content="teacher">
<meta name="theme-color" content="#0B3A87">
<title>ملاحظات الطلاب | MilEX</title>
<script src="milex-theme-sync.js" data-apply="1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="milex-common.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="milex-pages.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  .prow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .note{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
  .note .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:4px}
  .note p{margin:0;white-space:pre-wrap}
  .kind-behavior{border-inline-start:4px solid var(--warn)}
  .kind-level{border-inline-start:4px solid var(--accent)}
  .kind-note{border-inline-start:4px solid var(--muted)}
  .lock{font-size:12.5px}
</style>
</head>
<body>
<div class="topbar">
  <button class="icon-btn" onclick="MX.goBack()" title="رجوع">↩️</button>
  <h1>📝 ملاحظات الطلاب</h1>
  <button class="icon-btn" id="themeBtn" onclick="MX.toggleTheme(); this.textContent=MX.themeIcon()">🌙</button>
</div>
<div class="wrap" style="max-width:820px">
  <div class="banner lock">🔒 الملاحظات دي بتظهر للمدرس بس — المساعدين وأولياء الأمور مايقدروش يشوفوها (محمية على مستوى قاعدة البيانات).</div>
  <div class="banner err" id="needSql" style="display:none">لسه ملف <b>supabase_milex_upgrade.sql</b> ما اتشغّلش (جدول student_notes مش موجود).</div>

  <div class="card" id="pickCard">
    <div class="row">
      <select id="gradeSel" style="width:auto;min-width:190px" onchange="loadStudents()"></select>
      <input class="grow" type="search" id="q" placeholder="ابحث بالاسم أو الكود…" oninput="renderStudents()">
    </div>
    <div id="stList" style="margin-top:8px"></div>
  </div>

  <div class="card" id="noteCard" style="display:none">
    <div class="row"><h2 style="margin:0;flex:1" id="who"></h2><button class="btn ghost sm" onclick="closeStudent()">رجوع للقايمة</button></div>
    <div class="muted small" id="whoSub" style="margin-bottom:10px"></div>
    <div class="grid2">
      <div><label class="f">النوع</label>
        <select id="kind"><option value="behavior">سلوك</option><option value="level">مستوى دراسي</option><option value="note">ملاحظة عامة</option></select></div>
    </div>
    <label class="f" style="margin-top:10px">الملاحظة</label>
    <textarea id="body" placeholder="مثال: كثير الكلام في الحصة / مستواه ضعيف في الهندسة…"></textarea>
    <div class="actions" style="justify-content:flex-start"><button class="btn" id="addBtn" onclick="addNote()">➕ إضافة</button></div>
    <div id="notes" style="margin-top:14px"></div>
  </div>
</div>

<script src="milex-ui.js"></script>
<script>
  const { $, esc } = MX;
  const supa = MX.client();
  const KIND = { behavior:'سلوك', level:'مستوى', note:'ملاحظة' };
  let students = [], cur = null;

  function gradeKey(v){ return !v ? null : (MX.GRADES[v] ? v : MX.GRADE_KEYS.find(k => MX.GRADES[k].scanner === v) || null); }

  async function loadStudents(){
    $('stList').innerHTML = '<div class="state">جاري التحميل…</div>';
    try{ students = await MX.loadStudents([$('gradeSel').value], false); renderStudents(); }
    catch(e){ $('stList').innerHTML = `<div class="state err">${esc(e.message)}</div>`; }
  }
  function renderStudents(){
    const q = $('q').value.trim().toLowerCase();
    const l = students.filter(s => !q || s.name.toLowerCase().includes(q) || s.qr.toLowerCase().includes(q));
    $('stList').innerHTML = l.slice(0, 50).map(s => `<div class="prow"><div class="grow"><b>${esc(s.name)}</b>
      <div class="muted small">${esc(s.group || '—')} · <bdi>${esc(s.qr)}</bdi></div></div>
      <button class="btn sm" onclick="openStudent('${esc(s.qr.replace(/'/g, "\\'"))}')">الملاحظات</button></div>`).join('') || '<div class="state">مفيش نتائج</div>';
  }

  async function openStudent(qr){
    cur = students.find(s => s.qr === qr); if(!cur) return;
    $('pickCard').style.display = 'none'; $('noteCard').style.display = 'block';
    $('who').textContent = cur.name; $('whoSub').textContent = `${cur.gradeAr} · ${cur.group || '—'} · ${cur.qr}`;
    loadNotes();
  }
  function closeStudent(){ $('noteCard').style.display = 'none'; $('pickCard').style.display = 'block'; }

  async function loadNotes(){
    $('notes').innerHTML = '<div class="state">جاري التحميل…</div>';
    const { data, error } = await supa.from('student_notes').select('*').eq('qr_code', cur.qr).order('created_at', { ascending:false });
    if(error){
      if(/does not exist|schema cache|relation/i.test(error.message)) $('needSql').style.display = 'block';
      $('notes').innerHTML = `<div class="state err">${esc(error.message)}</div>`; return;
    }
    $('notes').innerHTML = (data || []).map(n => `<div class="note kind-${esc(n.kind)}">
      <div class="meta"><span class="tag">${esc(KIND[n.kind] || n.kind)}</span><span>${MX.fmtDateTime(n.created_at)}</span>
        <span style="flex:1"></span><button class="btn ghost sm" onclick="delNote(${Number(n.id)})">🗑</button></div>
      <p>${esc(n.body)}</p></div>`).join('') || '<div class="state">مفيش ملاحظات لسه</div>';
  }
  async function addNote(){
    const body = $('body').value.trim();
    if(!body){ MX.toast('اكتب الملاحظة الأول', true); return; }
    $('addBtn').disabled = true;
    const { error } = await supa.from('student_notes').insert({ qr_code:cur.qr, grade:cur.grade, student_name:cur.name, kind:$('kind').value, body });
    $('addBtn').disabled = false;
    if(error){ MX.toast('تعذر الحفظ: ' + error.message, true); return; }
    $('body').value = ''; MX.toast('اتحفظت ✔'); loadNotes();
  }
  async function delNote(id){
    if(!confirm('حذف الملاحظة دي؟')) return;
    const { error } = await supa.from('student_notes').delete().eq('id', id);
    if(error){ MX.toast(error.message, true); return; }
    loadNotes();
  }

  async function init(){
    $('themeBtn').textContent = MX.themeIcon();
    MX.GRADE_KEYS.forEach(k => $('gradeSel').add(new Option(MX.GRADES[k].ar, k)));
    const p = new URLSearchParams(location.search), gk = gradeKey(p.get('grade')), qr = p.get('qr');
    if(gk) $('gradeSel').value = gk;
    await loadStudents();
    if(qr) openStudent(qr);
  }
  init();
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
<script src="milex-search.js" defer></script>
</body>
</html>
