<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="milex-session.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="milex-perm" content="reports">
<meta name="theme-color" content="#0B3A87">
<title>لوحة الشرف | MilEX</title>
<script src="milex-theme-sync.js" data-apply="1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="milex-common.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="milex-pages.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  .board{background:linear-gradient(180deg,#0B3A87,#061F55);color:#fff;border-radius:18px;padding:22px 16px;text-align:center}
  .board h2{margin:0 0 2px;font-size:24px;color:#fff}
  .board .sub{color:#cfe0ff;font-size:13.5px;margin-bottom:16px}
  .pod{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;max-width:640px;margin:0 auto 16px}
  .pod .p{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 6px}
  .pod .p.r1{order:2;padding-top:24px;padding-bottom:20px;background:rgba(168,212,0,.22);border-color:#A8D400}
  .pod .p.r2{order:1}.pod .p.r3{order:3}
  .pod .m{font-size:30px}
  .pod .n{font-weight:700;font-size:14.5px;margin-top:4px;line-height:1.3}
  .pod .s{font-size:12px;color:#cfe0ff}
  .pod .sc{display:inline-block;margin-top:6px;background:#A8D400;color:#061F55;font-weight:700;border-radius:20px;padding:1px 10px;font-size:13px}
  .rest{max-width:640px;margin:0 auto;text-align:right}
  .rest .it{display:flex;gap:10px;align-items:center;padding:8px 12px;background:rgba(255,255,255,.08);border-radius:10px;margin-bottom:6px}
  .rest .it b.no{width:26px;height:26px;border-radius:50%;background:#A8D400;color:#061F55;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
  .rest .it .nm{flex:1;font-weight:600}
  .rest .it small{color:#cfe0ff}
  @media(max-width:520px){.pod .n{font-size:12.5px}.pod .m{font-size:24px}}
  @media print{ .board{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
</style>
</head>
<body>
<div class="topbar">
  <button class="icon-btn" onclick="MX.goBack()" title="رجوع">↩️</button>
  <h1>🏆 لوحة الشرف</h1>
</div>
<div class="wrap" style="max-width:760px">
  <div class="card no-print">
    <div class="grid2">
      <div><label class="f">الصف</label><select id="gradeSel" onchange="onGrade()"></select></div>
      <div><label class="f">الشهر</label><input type="month" id="monthIn"></div>
      <div><label class="f">المجموعة</label><select id="groupSel"><option value="">كل المجموعات</option></select></div>
      <div><label class="f">المعيار</label><select id="mode"><option value="both">حضور + درجات (50/50)</option><option value="exam">الدرجات فقط</option><option value="att">الحضور فقط</option></select></div>
    </div>
    <div class="actions" style="justify-content:flex-start">
      <button class="btn" id="goBtn" onclick="build()">عرض اللوحة</button>
      <button class="btn ghost" onclick="window.print()">🖨 طباعة</button>
    </div>
    <div class="muted small" id="note"></div>
  </div>
  <div id="out"></div>
</div>

<script src="milex-ui.js"></script>
<script>
  const { $, esc } = MX;
  const supa = MX.client();
  let all = [];

  async function onGrade(){
    $('groupSel').innerHTML = '<option value="">كل المجموعات</option>';
    all = await MX.loadStudents([$('gradeSel').value], false);
    [...new Set(all.map(s => s.group).filter(Boolean))].sort().forEach(g => $('groupSel').add(new Option(g, g)));
  }
  async function tryQ(mk){ try{ return await MX.fetchAll(mk); }catch(e){ return null; } }

  async function build(){
    const k = $('gradeSel').value, ym = $('monthIn').value, g = $('groupSel').value, mode = $('mode').value;
    if(!ym){ MX.toast('اختار الشهر', true); return; }
    const [Y, M] = ym.split('-').map(Number);
    const start = `${Y}-${MX.pad2(M)}-01`, end = M === 12 ? `${Y+1}-01-01` : `${Y}-${MX.pad2(M+1)}-01`;
    $('goBtn').disabled = true; $('out').innerHTML = '<div class="state">جاري الحساب…</div>';
    const GM = MX.GRADES[k];
    const [log, exams] = await Promise.all([
      tryQ((a,b) => supa.from('attendance_log').select('qr_code,status,log_date').eq('grade', k).gte('log_date', start).lt('log_date', end).range(a, b)),
      tryQ((a,b) => supa.from('الامتحانات').select('*').gte('created_at', start).lt('created_at', end).range(a, b))
    ]);
    const names = [k, GM.ar, GM.scanner, GM.reg].map(x => String(x).toLowerCase());
    const ex = (exams || []).filter(e => !e.grade || names.includes(String(e.grade).toLowerCase()));
    const scores = ex.length ? (await tryQ((a,b) => supa.from('نتائج_الامتحانات').select('*').in('exam_id', ex.map(e => e.id)).range(a, b)) || []) : [];
    const maxBy = {}; ex.forEach(e => maxBy[e.id] = Number(e.max_score) || null);
    $('note').textContent = (log === null ? 'سجل الحضور بالتاريخ مش متاح (شغّل ملف SQL) — بيتحسب الحضور من الإجمالي. ' : '')
      + (!ex.length && mode !== 'att' ? 'مفيش امتحانات في الشهر ده — الترتيب بالحضور بس.' : '');

    let rows = all.filter(s => !g || s.group === g).map(s => {
      let p, a;
      if(log){ const mine = log.filter(r => String(r.qr_code) === s.qr); p = new Set(mine.filter(r => r.status === 'present').map(r => r.log_date)).size; a = new Set(mine.filter(r => r.status === 'absent').map(r => r.log_date)).size; }
      else { p = s.att; a = s.abs; }
      const rate = (p + a) ? p / (p + a) * 100 : null;
      const my = scores.filter(x => String(x.student_code) === s.qr).map(x => { const m = maxBy[x.exam_id]; const v = Number(x.score); return (m && !isNaN(v)) ? v / m * 100 : null; }).filter(v => v != null);
      const exAvg = my.length ? my.reduce((x,y) => x + y, 0) / my.length : null;
      let score = null;
      if(mode === 'att') score = rate;
      else if(mode === 'exam') score = exAvg;
      else if(rate != null && exAvg != null) score = (rate + exAvg) / 2;
      else score = (ex.length ? null : rate);          // مفيش امتحانات أصلًا → بالحضور
      return { s, p, a, rate, exAvg, score };
    }).filter(r => r.score != null).sort((x, y) => y.score - x.score || (y.rate || 0) - (x.rate || 0) || x.s.name.localeCompare(y.s.name, 'ar'));
    $('goBtn').disabled = false;
    if(!rows.length){ $('out').innerHTML = '<div class="state">مفيش بيانات كفاية للشهر ده</div>'; return; }
    rows = rows.slice(0, 10);
    const sub = r => `${r.rate != null ? 'حضور ' + Math.round(r.rate) + '%' : ''}${r.exAvg != null ? ' · درجات ' + Math.round(r.exAvg) + '%' : ''}`;
    const medal = ['🥇','🥈','🥉'];
    $('out').innerHTML = `<div class="board"><h2>🏆 لوحة الشرف</h2>
      <div class="sub">${esc(GM.ar)}${g ? ' — ' + esc(g) : ''} · ${esc(MX.MONTHS_AR[M-1])} ${Y}</div>
      <div class="pod">${rows.slice(0,3).map((r,i) => `<div class="p r${i+1}"><div class="m">${medal[i]}</div><div class="n">${esc(r.s.name)}</div><div class="s">${esc(sub(r))}</div><span class="sc">${Math.round(r.score)}%</span></div>`).join('')}</div>
      <div class="rest">${rows.slice(3).map((r,i) => `<div class="it"><b class="no">${i+4}</b><span class="nm">${esc(r.s.name)}</span><small>${esc(sub(r))}</small><b>${Math.round(r.score)}%</b></div>`).join('')}</div>
      <div class="sub" style="margin:14px 0 0">MilEX EDU — أحسنتم وبالتوفيق للجميع 🌟</div></div>`;
  }

  async function init(){
    
    MX.GRADE_KEYS.forEach(k => $('gradeSel').add(new Option(MX.GRADES[k].ar, k)));
    $('monthIn').value = MX.ymNow();
    await onGrade();
  }
  init();
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
<script src="milex-copilot.js" defer></script>
</body>
</html>
