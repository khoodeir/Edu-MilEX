<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="milex-perm" content="materials">
<meta name="theme-color" content="#0B3A87">
<title>الواجبات والمواد | MilEX</title>
<script src="milex-theme-sync.js" data-apply="1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="milex-common.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="milex-pages.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  .it{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
  .it .ic{font-size:24px}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer}
  .drop.has{border-color:var(--ok);color:var(--ok)}
</style>
</head>
<body>
<div class="topbar">
  <button class="icon-btn" onclick="MX.goBack()" title="رجوع">↩️</button>
  <h1>📁 الواجبات والمواد</h1>
  <button class="icon-btn" id="themeBtn" onclick="MX.toggleTheme(); this.textContent=MX.themeIcon()">🌙</button>
</div>
<div class="wrap" style="max-width:820px">
  <div class="banner err" id="needSql" style="display:none">لسه ملف <b>supabase_milex_upgrade.sql</b> ما اتشغّلش (جدول materials / bucket مش موجودين).</div>
  <div class="card">
    <h2>➕ إضافة مادة</h2>
    <div class="grid2">
      <div><label class="f">الصف</label><select id="gradeSel" onchange="fillGroups(); loadList()"></select></div>
      <div><label class="f">المجموعة</label><select id="groupSel"><option value="">كل مجموعات الصف</option></select></div>
      <div><label class="f">النوع</label><select id="kind"><option value="homework">واجب</option><option value="pdf">ملف PDF / مذكرة</option><option value="video">فيديو (لينك)</option><option value="link">لينك آخر</option></select></div>
      <div><label class="f">العنوان</label><input type="text" id="title" placeholder="مثال: واجب الدرس الثالث"></div>
    </div>
    <label class="f" style="margin-top:10px">وصف (اختياري)</label>
    <input type="text" id="desc">
    <div style="margin-top:10px" id="fileBox">
      <label class="drop" id="drop"><input type="file" id="file" hidden accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.jpg,.jpeg,.png,.zip,.mp4"><span id="dropTxt">📎 اضغط لاختيار ملف (حتى 50 ميجا)</span></label>
    </div>
    <label class="f" style="margin-top:10px">أو لينك (يوتيوب / درايف…) — أنسب للفيديوهات الكبيرة</label>
    <input type="url" id="url" dir="ltr" placeholder="https://">
    <div class="actions" style="justify-content:flex-start"><button class="btn" id="addBtn" onclick="addMaterial()">رفع</button></div>
  </div>
  <div class="card">
    <h2>المواد المرفوعة</h2>
    <div id="list"><div class="state">جاري التحميل…</div></div>
  </div>
</div>

<script src="milex-ui.js"></script>
<script>
  const { $, esc } = MX;
  const supa = MX.client();
  const ICON = { homework:'📝', pdf:'📄', video:'🎬', link:'🔗', file:'📎' };
  let groupsByGrade = {};

  $('file').addEventListener('change', e => {
    const f = e.target.files[0];
    $('dropTxt').textContent = f ? `✅ ${f.name} (${(f.size/1048576).toFixed(1)} MB)` : '📎 اضغط لاختيار ملف (حتى 50 ميجا)';
    $('drop').classList.toggle('has', !!f);
    if(f && !$('title').value) $('title').value = f.name.replace(/\.[^.]+$/, '');
  });

  function fillGroups(){
    const k = $('gradeSel').value;
    $('groupSel').innerHTML = '<option value="">كل مجموعات الصف</option>';
    (groupsByGrade[k] || []).forEach(g => $('groupSel').add(new Option(g.label, g.id)));
  }

  const pubUrl = path => supa.storage.from('materials').getPublicUrl(path).data.publicUrl;

  async function addMaterial(){
    const title = $('title').value.trim(), url = $('url').value.trim(), file = $('file').files[0];
    if(!title){ MX.toast('اكتب عنوان', true); return; }
    if(!file && !url){ MX.toast('اختار ملف أو حط لينك', true); return; }
    if(file && file.size > 52428800){ MX.toast('الملف أكبر من 50 ميجا — استخدم لينك', true); return; }
    $('addBtn').disabled = true; $('addBtn').textContent = 'جاري الرفع…';
    try{
      let path = null;
      if(file){
        const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 6) || 'bin';
        path = `${$('gradeSel').value}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const up = await supa.storage.from('materials').upload(path, file, { contentType:file.type || undefined, upsert:false });
        if(up.error) throw up.error;
      }
      const { error } = await supa.from('materials').insert({
        grade:$('gradeSel').value, group_name:$('groupSel').value || null, title, kind:$('kind').value,
        description:$('desc').value.trim() || null, file_path:path, url:url || null });
      if(error){ if(path) await supa.storage.from('materials').remove([path]); throw error; }
      $('title').value = ''; $('desc').value = ''; $('url').value = ''; $('file').value = '';
      $('dropTxt').textContent = '📎 اضغط لاختيار ملف (حتى 50 ميجا)'; $('drop').classList.remove('has');
      MX.toast('اترفع ✔'); loadList();
    }catch(e){
      const m = String(e.message || e);
      if(/does not exist|schema cache|Bucket not found/i.test(m)) $('needSql').style.display = 'block';
      MX.toast('تعذر الرفع: ' + (/row-level security|policy/i.test(m) ? 'مش معاك صلاحية الواجبات والمواد' : m), true);
    }finally{ $('addBtn').disabled = false; $('addBtn').textContent = 'رفع'; }
  }

  async function loadList(){
    const k = $('gradeSel').value;
    const { data, error } = await supa.from('materials').select('*').eq('grade', k).order('created_at', { ascending:false });
    if(error){
      if(/does not exist|schema cache|relation/i.test(error.message)) $('needSql').style.display = 'block';
      $('list').innerHTML = `<div class="state err">${esc(error.message)}</div>`; return;
    }
    window._m = data || [];
    $('list').innerHTML = window._m.map((m, i) => {
      const href = m.url || (m.file_path ? pubUrl(m.file_path) : '#');
      return `<div class="it"><span class="ic">${ICON[m.kind] || '📎'}</span>
        <div class="grow"><b>${esc(m.title)}</b><div class="muted small">${esc(m.group_name || 'كل المجموعات')} · ${MX.fmtDate(m.created_at)}${m.description ? ' · ' + esc(m.description) : ''}</div></div>
        <a class="btn ghost sm" target="_blank" rel="noopener" href="${esc(href)}">فتح</a>
        <button class="btn danger sm" onclick="del(${i})">🗑</button></div>`;
    }).join('') || '<div class="state">مفيش مواد للصف ده</div>';
  }
  async function del(i){
    const m = window._m[i]; if(!m || !confirm(`حذف «${m.title}»؟`)) return;
    const { error } = await supa.from('materials').delete().eq('id', m.id);
    if(error){ MX.toast(error.message, true); return; }
    if(m.file_path) await supa.storage.from('materials').remove([m.file_path]);
    loadList();
  }

  async function init(){
    $('themeBtn').textContent = MX.themeIcon();
    MX.GRADE_KEYS.forEach(k => $('gradeSel').add(new Option(MX.GRADES[k].ar, k)));
    try{ groupsByGrade = await MILEX.loadGroups(supa); }catch(e){}
    fillGroups(); loadList();
  }
  init();
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
<script src="milex-search.js" defer></script>
</body>
</html>
