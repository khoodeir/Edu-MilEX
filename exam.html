<head>

<style>
  :root{
    color-scheme:light;
    --paper:#FFFFFF; --soft:#F2F6FB; --card:#FFFFFF; --ink:#101B33; --muted:#5C6A80;
    --brand:#0B3A87; --brand-d:#061F55; --brand-soft:#E8EFFA;
    --line:#DCE3ED; --line-d:#C6D2E3;
    --ok:#1F8A5B; --ok-soft:#E8F6EF; --err:#C0392B; --err-soft:#FDECEA; --warn:#B7791F; --warn-soft:#FDF5E3;
    --shadow:0 1px 2px rgba(16,27,51,.05), 0 4px 14px rgba(16,27,51,.04);
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ background:var(--paper); }
  body{ font-family:'Cairo',sans-serif; color:var(--ink); min-height:100vh; background:var(--paper); padding:18px 16px 96px; line-height:1.6; }
  .wrap{ max-width:680px; margin:0 auto; }
  .logo{ display:block; height:56px; width:auto; max-width:80%; object-fit:contain; margin:4px auto 18px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px 20px; box-shadow:var(--shadow); margin-bottom:16px; }
  h1{ font-size:22px; font-weight:700; color:var(--ink); text-align:center; margin-bottom:6px; }
  .sub{ text-align:center; font-size:14px; color:var(--muted); margin-bottom:18px; line-height:1.9; }
  .screen{ display:none; } .screen.on{ display:block; }
  input[type=text]{ width:100%; padding:14px; border-radius:12px; border:1.5px solid var(--line-d); background:#fff; color:var(--ink);
    font-family:'Space Grotesk','Cairo',sans-serif; font-size:22px; font-weight:700; letter-spacing:3px; text-align:center; text-transform:uppercase; direction:ltr; outline:none; transition:border-color .15s, box-shadow .15s; }
  input[type=text]::placeholder{ letter-spacing:0; font-size:15px; font-weight:500; font-family:'Cairo',sans-serif; text-transform:none; color:#9CA3AF; }
  input[type=text]:focus{ border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); }
  textarea.essay-in{ width:100%; min-height:120px; max-height:420px; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line-d); background:#fff; color:var(--ink);
    font-family:inherit; font-size:16px; line-height:1.9; resize:none; outline:none; transition:border-color .15s, box-shadow .15s; }
  textarea.essay-in:focus{ border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft); }
  .essay-meta{ font-size:12.5px; color:var(--muted); margin-top:6px; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:50px; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line-d); background:#fff; color:var(--ink);
    font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; margin-top:10px; transition:transform .12s, background .15s, border-color .15s; }
  .btn:hover{ background:var(--soft); }
  .btn:active{ transform:scale(.98); }
  .btn:focus-visible, .opt:focus-visible, .dot:focus-visible{ outline:3px solid var(--brand-soft); outline-offset:2px; border-color:var(--brand); }
  .btn.primary{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .btn.primary:hover{ background:var(--brand-d); border-color:var(--brand-d); }
  .btn:disabled{ opacity:.55; cursor:default; }
  .err{ background:var(--err-soft); color:var(--err); padding:10px 14px; border-radius:10px; font-size:14px; font-weight:600; margin-top:12px; display:none; }
  .err.show{ display:block; }
  .info-row{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .pill{ background:var(--soft); border:1px solid var(--line); color:var(--ink); padding:5px 14px; border-radius:99px; font-size:13px; font-weight:600; }
  #reader{ width:100%; margin-top:12px; border-radius:12px; overflow:hidden; display:none; border:1px solid var(--line); }

  .timerbar{ position:fixed; top:0; left:0; right:0; z-index:20; background:rgba(255,255,255,.96); border-bottom:1px solid var(--line);
    padding:calc(8px + env(safe-area-inset-top)) 16px 8px; display:none; backdrop-filter:blur(8px); }
  .timerbar.on{ display:block; }
  .timerbar .row{ max-width:680px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .time{ font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; color:var(--ink); direction:ltr; }
  .time.low{ color:var(--err); animation:blink 1s steps(2,start) infinite; }
  @keyframes blink{ 50%{ opacity:.45; } }
  @media (prefers-reduced-motion: reduce){ .time.low{ animation:none; } .btn, .bar i{ transition:none; } html{ scroll-behavior:auto; } }
  .prog{ font-size:13px; color:var(--muted); font-weight:600; }
  .bar{ height:4px; background:var(--soft); border-radius:99px; margin:6px auto 0; overflow:hidden; max-width:680px; }
  .bar i{ display:block; height:100%; width:100%; background:var(--brand); transition:width .3s linear; }
  .bar i.low{ background:var(--err); }

  .qnav{ max-width:680px; margin:8px auto 0; display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .qnav::-webkit-scrollbar{ display:none; }
  .qnav .dot{ flex:0 0 auto; min-width:32px; height:30px; padding:0 6px; border-radius:8px; border:1.5px solid var(--line-d); background:#fff; font:700 12.5px 'Space Grotesk',sans-serif; color:var(--muted); cursor:pointer; }
  .qnav .dot.done{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .qnav .dot.essay{ border-style:dashed; }
  .qnav .dot.essay.done{ border-style:solid; }
  .qcard{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow); scroll-margin-top:130px; }
  .qcard.answered{ border-color:#C3D4EE; }
  .qcard.r-ok{ border-color:#9ED5BC; } .qcard.r-bad{ border-color:#F0B4AD; } .qcard.r-part{ border-color:#E8CF9A; }
  .qcard.essay-q{ border-inline-start:4px solid var(--warn); }
  .qn{ font-size:13px; color:var(--muted); font-weight:600; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .qt{ font-size:17px; font-weight:700; line-height:1.9; margin-bottom:14px; white-space:pre-wrap; }
  .opt{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; margin-bottom:8px; cursor:pointer; font-size:16px; background:#fff; transition:border-color .15s, background .15s; }
  .opt:hover{ background:var(--soft); }
  .opt .lt{ width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line-d); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; color:var(--muted); background:#fff; }
  .opt.sel{ border-color:var(--brand); background:var(--brand-soft); }
  .opt.sel .lt{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .opt.ok{ border-color:var(--ok); background:var(--ok-soft); } .opt.ok .lt{ border-color:var(--ok); color:var(--ok); }
  .opt.bad{ border-color:var(--err); background:var(--err-soft); } .opt.bad .lt{ border-color:var(--err); color:var(--err); }
  .submitbar{ position:fixed; bottom:0; left:0; right:0; z-index:20; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.96); border-top:1px solid var(--line); display:none; backdrop-filter:blur(8px); }
  .submitbar.on{ display:block; }
  .submitbar .btn{ max-width:680px; margin:0 auto; }

  .ring{ position:relative; width:170px; height:170px; border-radius:50%; margin:6px auto 14px; display:flex; align-items:center; justify-content:center; flex-direction:column; }
  .ring::before{ content:''; position:absolute; inset:14px; border-radius:50%; background:var(--card); }
  .ring b, .ring span{ position:relative; z-index:1; line-height:1.25; }
  .ring b{ font-family:'Space Grotesk',sans-serif; font-size:34px; direction:ltr; }
  .ring span{ font-size:15px; font-weight:700; color:var(--muted); }
  .grade{ display:inline-block; padding:4px 18px; border-radius:99px; font-size:15px; font-weight:700; margin-bottom:14px; }
  .grade.good{ background:var(--ok-soft); color:var(--ok); } .grade.mid{ background:var(--warn-soft); color:var(--warn); } .grade.low{ background:var(--err-soft); color:var(--err); }
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:14px 0 4px; text-align:center; }
  .stat{ background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:10px 8px; }
  .stat b{ display:block; font-family:'Space Grotesk',sans-serif; font-size:22px; color:var(--ink); direction:ltr; }
  .stat span{ font-size:12.5px; color:var(--muted); font-weight:600; }
  .stat.ok b{ color:var(--ok); } .stat.bad b{ color:var(--err); } .stat.warn b{ color:var(--warn); }
  .tag{ display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:700; }
  .tag.ok{ background:var(--ok-soft); color:var(--ok); } .tag.bad{ background:var(--err-soft); color:var(--err); } .tag.part{ background:var(--warn-soft); color:var(--warn); } .tag.none{ background:var(--soft); color:var(--muted); }
  .anscard{ background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:15px; line-height:1.9; white-space:pre-wrap; }
  .anscard small{ display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:2px; }
  .anscard.model{ background:var(--ok-soft); border-color:#BFE3D2; }
  .simrow{ margin-top:8px; font-size:14px; }
  .simbar{ height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:6px; }
  .simbar i{ display:block; height:100%; background:var(--brand); }
  .lock{ position:fixed; inset:0; background:rgba(255,255,255,.94); z-index:40; display:none; align-items:center; justify-content:center; padding:20px; text-align:center; color:var(--ink); font-size:18px; font-weight:700; }
  .lock.on{ display:flex; }
  .foot{ text-align:center; font-size:12px; color:var(--muted); margin-top:24px; } .foot a{ color:inherit; }
</style>
<link rel="stylesheet" href="milex-theme.css">
<script src="milex-motion.js" defer></script>
</head>
<body>
<div class="timerbar" id="timerbar">
  <div class="row"><span class="prog" id="progTxt"></span><span class="time" id="timeTxt">--:--</span></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="qnav" id="qnav"></div>
</div>

<div class="wrap">
  <img class="logo" src="logo.png" alt="MilEX EDU" onerror="this.style.display='none'">

  
  <div class="screen on" id="sLoad"><div class="card"><div class="sub" id="loadTxt" style="margin:0;">جاري تحميل الامتحان…</div></div></div>

  
  <div class="screen" id="sGate">
    <div class="card">
      <h1 id="gTitle">الامتحان</h1>
      <div class="sub" id="gSub"></div>
      <div class="info-row" id="gPills"></div>
      <label for="code" style="display:block; font-size:14px; font-weight:700; color:var(--ink); margin-bottom:8px; text-align:center;">اكتب كود الـ QR بتاعك</label>
      <input type="text" id="code" placeholder="مثال: ST123456" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
      <div class="err" id="gErr"></div>
      <button class="btn primary" id="startBtn" type="button">ابدأ الامتحان</button>
      <button class="btn" id="scanBtn" type="button">📷 أو امسح الـ QR بالكاميرا</button>
      <div id="reader"></div>
    </div>
  </div>

  
  <div class="screen" id="sExam">
    <div class="card" style="text-align:center; padding:14px;"><b id="eName"></b><div class="sub" style="margin:4px 0 0;" id="eTitle"></div></div>
    <div id="qList"></div>
  </div>

  
  <div class="screen" id="sRes">
    <div class="card" style="text-align:center;">
      <h1 id="rTitle">النتيجة</h1>
      <div class="sub" id="rName" style="margin-bottom:10px;"></div>
      <div class="ring" id="rRing"><b id="rScore">0/0</b><span id="rPct"></span></div>
      <div class="grade" id="rGrade"></div>
      <div class="stats" id="rStats"></div>
      <div class="sub" id="rMsg" style="font-weight:700; font-size:15px; margin:14px 0 0;"></div>
    </div>
    <div id="rReview"></div>
  </div>

  <div class="foot">Powered by <a href="milex.html" target="_blank" rel="noopener noreferrer">MilEX</a></div>
</div>

<div class="submitbar" id="submitbar"><button class="btn primary" id="submitBtn" type="button" style="margin-top:0;">✅ تسليم الامتحان</button></div>
<div class="lock" id="lock"><div id="lockTxt">الوقت خلص — جاري تسليم الامتحان…</div></div>

<script>
const SUPABASE_URL = "https://evbjulsahncllewwvlxp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2Ymp1bHNhaG5jbGxld3d2bHhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NzE5MjUsImV4cCI6MjA5OTI0NzkyNX0.Xg9sU6ZenUU3kC2RNIbvZmK19KvE28MM2oyGcKNn8UA";
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const TOKEN = new URLSearchParams(location.search).get('e') || '';
const $ = id => document.getElementById(id);
const LETTERS = ['أ','ب','ج','د','هـ','و','ز','ح'];
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function screen(id){ ['sLoad','sGate','sExam','sRes'].forEach(x => $(x).classList.toggle('on', x === id)); window.scrollTo(0,0); }
function gErr(t){ const e=$('gErr'); e.textContent=t||''; e.classList.toggle('show', !!t); }
async function rpc(fn, args){ const { data, error } = await supa.rpc(fn, args); if(error) throw error; return data; }

let CODE = '', QS = [], ANS = {}, DEADLINE = 0, OFFSET = 0, TOTAL_MS = 1, timer = null, finishing = false, saveT = null, scanner = null;
const lsKey = () => `milexExam:${TOKEN}:${CODE}`;
const nowSrv = () => Date.now() + OFFSET;
const fmt = ms => { const s = Math.max(0, Math.ceil(ms/1000)); const m = Math.floor(s/60), r = s%60; return (m>=60 ? Math.floor(m/60)+':'+String(m%60).padStart(2,'0') : String(m).padStart(2,'0')) + ':' + String(r).padStart(2,'0'); };
const isAns = v => v != null && String(v).trim() !== '';
const isEssay = q => q && q.type === 'essay';
const numFmt = n => { n = Number(n) || 0; return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100); };

(async function boot(){
  if(!TOKEN){ $('loadTxt').textContent = 'لينك الامتحان ناقص. اطلب اللينك من المدرس.'; return; }
  try{
    const info = await rpc('fn_exam_info', { p_token: TOKEN });
    if(!info.ok && info.reason === 'not_found'){ $('loadTxt').textContent = 'لينك الامتحان غلط. اطلب اللينك من المدرس.'; return; }
    if(!info.ok && info.reason === 'not_published'){ $('loadTxt').textContent = 'الامتحان ده لسه ماتنشرش. حاول تاني بعد ما المدرس يبلغك.'; return; }
    $('gTitle').textContent = info.title || 'الامتحان';
    if(info.ok){
      $('gSub').textContent = 'اكتب كودك أو امسحه، وبعدها الامتحان هيبدأ والوقت هيتحسب من لحظة دخولك.';
      $('gPills').innerHTML = `<span class="pill">⏱ ${info.duration_min} دقيقة</span><span class="pill">📝 ${info.question_count} سؤال</span>`;
      if(info.closes_at) $('gPills').innerHTML += `<span class="pill">🔒 ينتهي ${new Date(info.closes_at).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'})}</span>`;
    } else {
      $('gSub').textContent = 'الامتحان ده اتقفل. لو كنت دخلته قبل كده اكتب كودك تشوف نتيجتك.';
    }
    screen('sGate');
  }catch(e){ console.error(e); $('loadTxt').textContent = 'مشكلة في الاتصال بالنت. جرّب تحدّث الصفحة.'; }
})();

$('code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/\s+/g,''); gErr(''); });
$('code').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); begin(); } });
$('startBtn').addEventListener('click', begin);
$('scanBtn').addEventListener('click', toggleScan);

async function toggleScan(){
  if(scanner){ return stopScan(); }
  const rd = $('reader'); rd.style.display = 'block'; $('scanBtn').textContent = '✖ إغلاق الكاميرا';
  try{
    scanner = new Html5Qrcode('reader', { verbose:false });
    await scanner.start({ facingMode:'environment' }, { fps:10, qrbox:{ width:220, height:220 } },
      txt => { const v = String(txt||'').trim().toUpperCase(); if(!v) return; $('code').value = v; stopScan().then(begin); }, () => {});
  }catch(e){ console.warn(e); stopScan(); gErr('مقدرناش نفتح الكاميرا. اسمح بالكاميرا أو اكتب الكود بإيدك.'); }
}
async function stopScan(){
  try{ if(scanner){ await scanner.stop(); await scanner.clear(); } }catch(_){}
  scanner = null; $('reader').style.display = 'none'; $('scanBtn').textContent = '📷 أو امسح الـ QR بالكاميرا';
}

async function begin(){
  const code = $('code').value.trim().toUpperCase();
  if(!code){ gErr('اكتب كود الـ QR الأول'); return; }
  gErr(''); const b = $('startBtn'); b.disabled = true; b.textContent = 'جاري التحقق…';
  try{
    const r = await rpc('fn_exam_start', { p_token: TOKEN, p_code: code });
    if(!r.ok){
      gErr({ bad_code:'الكود ده مش متسجل في السنة الدراسية بتاعة الامتحان. اتأكد منه.', closed:'الامتحان اتقفل ومقدرش تدخله دلوقتي.',
        not_published:'الامتحان لسه ماتنشرش.', not_found:'لينك الامتحان غلط.' }[r.reason] || 'تعذّر بدء الامتحان.');
      return;
    }
    CODE = code;
    if(r.state === 'done') return showResult(r, true);
    startExam(r);
  }catch(e){ console.error(e); gErr('مشكلة في الاتصال بالنت. جرّب تاني.'); }
  finally{ b.disabled = false; b.textContent = 'ابدأ الامتحان'; }
}

function startExam(r){
  QS = r.questions || []; ANS = Object.assign({}, r.answers || {});
  try{ const loc = JSON.parse(localStorage.getItem(lsKey()) || '{}'); Object.assign(ANS, loc); }catch(_){}
  OFFSET = Number(r.server_now) - Date.now(); DEADLINE = Number(r.deadline_ms);
  TOTAL_MS = Math.max(1000, DEADLINE - Number(r.server_now));
  $('eName').textContent = r.student_name || ''; $('eTitle').textContent = r.title || '';
  renderQs(); screen('sExam');
  $('timerbar').classList.add('on'); $('submitbar').classList.add('on');
  document.body.style.paddingTop = '116px';
  window.addEventListener('beforeunload', warnLeave);
  tick(); timer = setInterval(tick, 250);
}
const warnLeave = e => { if(!finishing){ e.preventDefault(); e.returnValue = ''; } };
function renderQs(){
  const box = $('qList'); box.innerHTML = '';
  QS.forEach((q, i) => {
    const c = document.createElement('div'); c.className = 'qcard' + (isEssay(q) ? ' essay-q' : '') + (isAns(ANS[q.id]) ? ' answered' : ''); c.id = 'q' + q.id;
    c.innerHTML = `<div class="qn"><span>سؤال ${i+1} من ${QS.length}${isEssay(q) ? ' · مقالي ✍️' : ''}</span><span>${numFmt(q.points)} ${Number(q.points) > 1 ? 'درجات' : 'درجة'}</span></div><div class="qt">${esc(q.text)}</div>`;
    if(isEssay(q)){
      const ta = document.createElement('textarea'); ta.className = 'essay-in'; ta.dir = 'auto'; ta.rows = 5;
      ta.placeholder = 'اكتب إجابتك هنا بأسلوبك…';
      ta.value = typeof ANS[q.id] === 'string' ? ANS[q.id] : '';
      const meta = document.createElement('div'); meta.className = 'essay-meta';
      const info = () => { const w = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0; meta.textContent = w ? `${w} كلمة · بتتحفظ لوحدها ✓` : 'إجابتك بتتحفظ لوحدها وإنت بتكتب'; };
      const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 420) + 'px'; };
      ta.addEventListener('input', () => {
        if(finishing) return;
        ANS[q.id] = ta.value; c.classList.toggle('answered', isAns(ta.value)); persist(); updProg(); info(); grow();
      });
      c.appendChild(ta); c.appendChild(meta); info(); setTimeout(grow, 0);
    } else {
      (q.options || []).forEach((o, oi) => {
        const d = document.createElement('div'); d.className = 'opt' + (Number(ANS[q.id]) === oi && ANS[q.id] != null ? ' sel' : '');
        d.innerHTML = `<span class="lt">${LETTERS[oi] || oi+1}</span><span>${esc(o)}</span>`;
        d.onclick = () => { if(finishing) return; ANS[q.id] = oi; c.classList.add('answered'); c.querySelectorAll('.opt').forEach((x,k)=> x.classList.toggle('sel', k===oi)); persist(); updProg(); };
        c.appendChild(d);
      });
    }
    box.appendChild(c);
  });
  $('qnav').innerHTML = QS.map((q,i) => `<button type="button" class="dot${isEssay(q) ? ' essay' : ''}" data-i="${q.id}" aria-label="سؤال ${i+1}">${i+1}</button>`).join('');
  $('qnav').onclick = e => { const b = e.target.closest('.dot'); if(!b) return; const el = $('q' + b.dataset.i); if(el) el.scrollIntoView({ behavior:'smooth', block:'start' }); };
  updProg();
}
function updProg(){
  const n = QS.filter(q => isAns(ANS[q.id])).length; $('progTxt').textContent = `اتجاوب ${n} من ${QS.length}`;
  document.querySelectorAll('#qnav .dot').forEach((d,i) => d.classList.toggle('done', !!QS[i] && isAns(ANS[QS[i].id])));
}
function persist(){
  try{ localStorage.setItem(lsKey(), JSON.stringify(ANS)); }catch(_){}
  clearTimeout(saveT); saveT = setTimeout(() => { rpc('fn_exam_save', { p_token: TOKEN, p_code: CODE, p_answers: ANS }).catch(()=>{}); }, 700);
}
function tick(){
  const left = DEADLINE - nowSrv();
  $('timeTxt').textContent = fmt(left);
  const low = left <= 60000; $('timeTxt').classList.toggle('low', low); $('barFill').classList.toggle('low', low);
  $('barFill').style.width = Math.max(0, Math.min(100, left / TOTAL_MS * 100)) + '%';
  if(left <= 0 && !finishing){ finish(true); }
}
$('submitBtn').addEventListener('click', () => {
  const left = QS.filter(q => !isAns(ANS[q.id])).length;
  const msg = left ? `لسه ${left} سؤال ماجاوبتش عليهم. تسلّم برضو؟` : 'متأكد إنك عايز تسلّم الامتحان؟';
  if(confirm(msg)) finish(false);
});

async function finish(auto){
  if(finishing) return; finishing = true; clearInterval(timer);
  if(auto){ $('lockTxt').textContent = 'الوقت خلص — جاري تسليم الامتحان…'; } else { $('lockTxt').textContent = 'جاري تسليم الامتحان…'; }
  $('lock').classList.add('on'); clearTimeout(saveT);
  let tries = 0;
  while(true){
    try{
      const r = await rpc('fn_exam_submit', { p_token: TOKEN, p_code: CODE, p_answers: ANS, p_auto: !!auto });
      if(r && r.ok){ afterSubmit(r, auto); return; }
      if(r && r.reason){ $('lockTxt').textContent = 'تعذّر التسليم. كلّم المدرس.'; return; }
    }catch(e){ console.warn('submit retry', e); }
    tries++; $('lockTxt').textContent = 'مفيش اتصال بالنت… بنحاول نسلّم تاني (' + tries + ')';
    await new Promise(r => setTimeout(r, 3000));
  }
}
function afterSubmit(r, auto){
  window.removeEventListener('beforeunload', warnLeave);
  const answered = QS.filter(q => isAns(ANS[q.id])).length, qcount = QS.length;
  try{ localStorage.removeItem(lsKey()); }catch(_){}
  $('lock').classList.remove('on'); $('timerbar').classList.remove('on'); $('submitbar').classList.remove('on'); document.body.style.paddingTop = '';
  r._answered = answered; r._qcount = qcount;
  showResult(r, false, auto);
}

const essayWait = r => !!r && (r.essay_state === 'pending' || r.essay_state === 'grading');
async function settleEssays(r){
  $('lockTxt').textContent = 'جاري تصحيح الإجابات المقالية… ممكن ياخد لحظات ⏳'; $('lock').classList.add('on');
  let cur = r;
  try{
    for(let i = 0; i < 8 && essayWait(cur); i++){
      try{ await supa.functions.invoke('grade-essays', { body: { token: TOKEN, code: CODE } }); }catch(e){ console.warn(e); }
      const x = await rpc('fn_exam_submit', { p_token: TOKEN, p_code: CODE, p_answers: {}, p_auto: false });
      if(x && x.ok) cur = Object.assign({}, r, x);
      if(essayWait(cur)) await new Promise(res => setTimeout(res, 2500));
    }
  }catch(e){ console.warn(e); }
  $('lock').classList.remove('on');
  return cur;
}

function gradeOf(p){
  if(p >= 90) return ['ممتاز','good']; if(p >= 80) return ['جيد جدًا','good']; if(p >= 65) return ['جيد','mid'];
  if(p >= 50) return ['مقبول','mid']; return ['محتاج مذاكرة أكتر','low'];
}
async function showResult(r, fromStart, auto){
  if(essayWait(r)) r = await settleEssays(r);
  const score = Number(r.score) || 0, total = Number(r.total) || 0, pct = total ? Math.round(score / total * 100) : 0;
  $('rName').textContent = (r.student_name || '') + (r.title ? ' — ' + r.title : '');
  $('rScore').textContent = `${numFmt(score)}/${numFmt(total)}`; $('rPct').textContent = pct + '%';
  const col = pct >= 65 ? 'var(--ok)' : (pct >= 50 ? 'var(--warn)' : 'var(--err)');
  $('rRing').style.background = `conic-gradient(${col} ${pct}%, var(--line) 0)`;
  $('rScore').style.color = col;
  const g = gradeOf(pct); const ge = $('rGrade'); ge.textContent = g[0]; ge.className = 'grade ' + g[1];
  $('rMsg').textContent = fromStart ? 'إنت سلّمت الامتحان ده قبل كده، دي نتيجتك.' :
    (auto || r.auto_submitted ? 'الوقت خلص واتسلّم امتحانك تلقائي. ' : 'اتسلّم امتحانك بنجاح. ') + '✅';
  if(essayWait(r)) $('rMsg').textContent += ' · تصحيح الأسئلة المقالية لسه جاري، افتح الصفحة تاني بعد شوية وهتتحدّث الدرجة.';

  const rv = $('rReview'); rv.innerHTML = '';
  let review = r.review;
  if(!review && fromStart && r.show_answers){
    try{ const x = await rpc('fn_exam_submit', { p_token: TOKEN, p_code: CODE, p_answers: {}, p_auto: false }); review = x && x.review; }catch(_){}
  }
  const hasReview = Array.isArray(review) && review.length;

  const qcount = hasReview ? review.length : (r._qcount != null ? r._qcount : (r.question_count || null));
  const stats = [];
  stats.push(['', numFmt(score) + ' / ' + numFmt(total), 'الدرجة']);
  stats.push(['', pct + '%', 'النسبة']);
  if(qcount != null) stats.push(['', qcount, 'عدد الأسئلة']);
  if(r._answered != null) stats.push(['', r._answered, 'اتجاوب عليها']);
  if(hasReview){
    const mcq = review.filter(q => q.type !== 'essay');
    const right = mcq.filter(q => q.chosen != null && q.chosen === q.correct).length;
    const wrong = mcq.filter(q => q.chosen != null && q.chosen !== q.correct).length;
    const skipped = review.filter(q => q.type === 'essay' ? !isAns(q.answer != null ? q.answer : q.student_answer) : q.chosen == null).length;
    if(mcq.length){ stats.push(['ok', right, 'إجابات صح']); stats.push(['bad', wrong, 'إجابات غلط']); }
    if(skipped) stats.push(['warn', skipped, 'من غير إجابة']);
  }
  $('rStats').innerHTML = stats.map(s => `<div class="stat ${s[0]}"><b>${esc(s[1])}</b><span>${s[2]}</span></div>`).join('');

  if(hasReview){
    const h = document.createElement('h1'); h.style.cssText = 'font-size:18px; margin:6px 0 12px;'; h.textContent = 'تفاصيل الأسئلة'; rv.appendChild(h);
    review.forEach((q, i) => {
      const c = document.createElement('div'); c.className = 'qcard';
      const pts = q.points != null ? Number(q.points) : null;
      const earned = q.earned != null ? Number(q.earned) : (q.score != null ? Number(q.score) : null);
      let tag = '', cls = '', body = '';
      if(q.type === 'essay'){
        const sa = q.answer != null ? q.answer : q.student_answer;
        const sim = q.similarity != null ? Math.round(Number(q.similarity)) : null;
        if(!isAns(sa)){ tag = '<span class="tag none">ماجاوبتش</span>'; }
        else if(earned != null && pts != null){ tag = earned >= pts ? '<span class="tag ok">كاملة</span>' : (earned > 0 ? '<span class="tag part">جزء من الدرجة</span>' : '<span class="tag bad">صفر</span>'); cls = earned >= pts ? ' r-ok' : (earned > 0 ? ' r-part' : ' r-bad'); }
        else { tag = '<span class="tag none">اتسجلت</span>'; }
        body = `<div class="anscard"><small>إجابتك</small>${isAns(sa) ? esc(sa) : '<span style="color:var(--err);">ماجاوبتش على السؤال ده</span>'}</div>`
          + (q.model_answer ? `<div class="anscard model"><small>الإجابة النموذجية</small>${esc(q.model_answer)}</div>` : '')
          + (sim != null ? `<div class="simrow">نسبة التشابه مع الإجابة النموذجية: <b>${sim}%</b><div class="simbar"><i style="width:${Math.max(0, Math.min(100, sim))}%"></i></div></div>` : '');
      } else {
        const right = q.chosen != null && q.chosen === q.correct;
        tag = q.chosen == null ? '<span class="tag none">ماجاوبتش</span>' : (right ? '<span class="tag ok">صح ✔</span>' : '<span class="tag bad">غلط ✖</span>');
        cls = q.chosen == null ? '' : (right ? ' r-ok' : ' r-bad');
        body = (q.options||[]).map((o, oi) => {
          const k = oi === q.correct ? 'ok' : (oi === q.chosen ? 'bad' : '');
          return `<div class="opt ${k}" style="cursor:default;"><span class="lt">${LETTERS[oi]||oi+1}</span><span>${esc(o)}</span>${oi===q.correct?' ✔':''}${oi===q.chosen && oi!==q.correct?' (إجابتك)':''}</div>`;
        }).join('') + (q.chosen == null ? '<div class="sub" style="margin:6px 0 0; color:var(--err);">ماجاوبتش على السؤال ده</div>' : '');
      }
      const got = earned != null ? earned : (q.type === 'essay' ? null : (pts != null ? (q.chosen != null && q.chosen === q.correct ? pts : 0) : null));
      const ptsTxt = pts != null ? `<span>${got != null ? numFmt(got) + ' من ' : ''}${numFmt(pts)} ${pts > 1 ? 'درجات' : 'درجة'}</span>` : '';
      c.className = 'qcard' + cls + (q.type === 'essay' ? ' essay-q' : '');
      c.innerHTML = `<div class="qn"><span>سؤال ${i+1} ${tag}</span>${ptsTxt}</div><div class="qt">${esc(q.text)}</div>` + body;
      rv.appendChild(c);
    });
  }
  screen('sRes');
  if(!essayWait(r) && CODE && window.MILEX_AI){ MILEX_AI.mountForStudent(supa, TOKEN, CODE, rv); }
}
</script>

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
